    <ellipse cx="490" cy="812" rx="300" ry="56" fill="#FFD320" opacity="0.28" filter="url(#blur)" style="mix-blend-mode:screen"/>
  </g>
  <use href="#squircle" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
