    <path id="body" d="M 236 452 C 270 490 340 524 420 524 C 460 524 484 500 500 470 L 700 470 C 770 480 826 550 820 634 C 814 726 730 790 600 792 L 410 792 C 300 792 246 722 240 640 C 236 580 226 506 236 452 Z"/>
    <clipPath id="clip"><use href="#squircle"/></clipPath>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B4CB0"/>
      <stop offset="1" stop-color="#171D50"/>
    </linearGradient>
    <radialGradient id="glow" cx="500" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6F86FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6F86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="742" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2258" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#1B2258" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#11163E"/>
    </linearGradient>
    <radialGradient id="rubber" cx="470" cy="380" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF27E"/>
      <stop offset="0.45" stop-color="#FFD320"/>
      <stop offset="0.85" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#F08C00"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="600" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D95F00" stop-opacity="0"/>
      <stop offset="1" stop-color="#D95F00" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="560" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC71C"/>
      <stop offset="1" stop-color="#F29A00"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="364" x2="0" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#F0560A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="duckShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A0E2E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <use href="#squircle" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- speech bubble -->
    <g filter="url(#duckShadow)">
      <path d="M 726 168 H 828 A 40 40 0 0 1 868 208 V 262 A 40 40 0 0 1 828 302 H 790 L 748 336 L 754 302 H 726 A 40 40 0 0 1 686 262 V 208 A 40 40 0 0 1 726 168 Z" fill="#FFFFFF"/>
    </g>
    <g fill="none" stroke="#3B4CB0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 744 212 L 718 235 L 744 258"/>
      <path d="M 810 212 L 836 235 L 810 258"/>
      <path d="M 788 204 L 766 266"/>
    </g>

    <!-- duck -->
    <g transform="translate(-34 0)">
      <g filter="url(#duckShadow)">
        <g fill="url(#rubber)">
          <use href="#body"/>
          <circle cx="590" cy="372" r="128"/>
        </g>
      </g>
      <use href="#body" fill="url(#belly)"/>
      <path d="M 352 586 C 430 560 560 548 640 588 C 690 614 676 686 590 698 C 500 710 410 660 352 586 Z" fill="url(#wing)"/>
      <path d="M 372 588 C 450 566 560 558 630 594" fill="none" stroke="#FFEB8A" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M 700 420 C 744 428 806 430 842 420 C 850 438 828 456 792 460 C 752 464 716 452 698 436 Z" fill="#E2520A"/>
      <path d="M 688 384 C 736 354 816 356 854 388 C 870 402 862 420 842 422 C 800 428 740 424 698 416 Z" fill="url(#beak)"/>
      <path d="M 712 376 C 752 362 806 364 836 384" fill="none" stroke="#FFC98F" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="626" cy="404" rx="26" ry="15" fill="#FF7A45" opacity="0.35"/>
      <circle cx="630" cy="334" r="24" fill="#1A1E3F"/>
      <circle cx="639" cy="325" r="8.5" fill="#FFFFFF"/>
      <circle cx="622" cy="343" r="3.5" fill="#FFFFFF" opacity="0.7"/>
      <ellipse cx="538" cy="292" rx="46" ry="24" transform="rotate(-30 538 292)" fill="#FFFFFF" opacity="0.75" filter="url(#soft)"/>
      <ellipse cx="320" cy="540" rx="48" ry="16" transform="rotate(28 320 540)" fill="#FFFFFF" opacity="0.45" filter="url(#soft)"/>
    </g>

    <!-- code, as water -->
    <rect y="742" width="1024" height="282" fill="url(#water)"/>
    <path d="M 196 760 C 330 750 650 750 800 760" fill="none" stroke="#B9C6FF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    <g stroke-width="24" stroke-linecap="round">
      <path d="M 160 796 H 250" stroke="#C099FF"/>
      <path d="M 292 796 H 470" stroke="#82AAFF"/>
      <path d="M 512 796 H 596" stroke="#FF966C"/>
      <path d="M 638 796 H 860" stroke="#86E1FC"/>
      <g opacity="0.8">
        <path d="M 230 846 H 330" stroke="#82AAFF"/>
        <path d="M 372 846 H 560" stroke="#C3E88D"/>
        <path d="M 602 846 H 760" stroke="#FCA7EA"/>
      </g>
      <g opacity="0.6">
        <path d="M 300 896 H 380" stroke="#C099FF"/>
        <path d="M 422 896 H 640" stroke="#86E1FC"/>
